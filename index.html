<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Прикроватная тумба — 3D-модель 600 × 450 × 510 мм</title>
  <meta name="description" content="Интерактивная 3D-модель прикроватной тумбы с выдвижным ящиком. Экспорт в SketchUp: скрипт .rb и модель .dae." />
  <meta property="og:title" content="Прикроватная тумба — 3D-модель" />
  <meta property="og:description" content="3D-модель прикроватной тумбы 600 × 450 × 510 мм с выдвижным ящиком. Экспорт в SketchUp (.rb, .dae)." />
  <meta name="theme-color" content="#efe6da" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8d9c6'/%3E%3Crect x='12' y='20' width='40' height='30' rx='3' fill='%23b4855a'/%3E%3Crect x='16' y='24' width='32' height='10' rx='2' fill='%23d9b98f'/%3E%3Crect x='16' y='38' width='32' height='8' rx='2' fill='%23a97a4f'/%3E%3Crect x='26' y='28' width='12' height='2' rx='1' fill='%23704a28'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./assets/styles.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="app">
    <canvas id="scene" aria-label="Интерактивная 3D-модель прикроватной тумбы" role="img"></canvas>
    <div class="backdrop" aria-hidden="true"></div>

    <header class="brand panel">
      <div class="brand__icon" aria-hidden="true">🪵</div>
      <div class="brand__text">
        <h1>Прикроватная тумба</h1>
        <p>3D-модель · дуб · один ящик</p>
      </div>
    </header>

    <aside class="specs panel" aria-label="Габариты">
      <div class="specs__row">
        <span class="specs__label">Ш</span><strong>600</strong><span class="specs__unit">мм</span>
      </div>
      <div class="specs__row">
        <span class="specs__label">Г</span><strong>450</strong><span class="specs__unit">мм</span>
      </div>
      <div class="specs__row">
        <span class="specs__label">В</span><strong>510</strong><span class="specs__unit">мм</span>
      </div>
    </aside>

    <div class="controls" role="group" aria-label="Управление моделью">
      <button id="drawer-toggle" class="btn btn--primary" type="button" aria-pressed="false">
        <span class="btn__icon" data-icon>📤</span>
        <span class="btn__label" data-label>Открыть ящик</span>
      </button>
      <button id="reset-view" class="btn btn--ghost" type="button" title="Сбросить ракурс" aria-label="Сбросить ракурс">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 12a8 8 0 1 0 2.35-5.66M4 4v4h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <section class="export panel" aria-label="Экспорт в SketchUp">
      <div class="export__head">
        <span class="export__dot" aria-hidden="true"></span>
        <h2>Экспорт в SketchUp</h2>
      </div>
      <div class="export__actions">
        <button id="export-rb" class="btn btn--file" type="button">
          <span class="btn__icon" aria-hidden="true">⬇</span>
          <span class="btn__stack">
            <span class="btn__title">Скрипт .rb</span>
            <span class="btn__sub">сохранит .skp</span>
          </span>
        </button>
        <button id="export-dae" class="btn btn--file" type="button">
          <span class="btn__icon" aria-hidden="true">⬇</span>
          <span class="btn__stack">
            <span class="btn__title">Модель .dae</span>
            <span class="btn__sub">File → Import</span>
          </span>
        </button>
      </div>
      <p class="export__hint">.dae: File → Import · .rb: Ruby Console → load 'путь'</p>
      <p class="export__status" id="export-status" role="status" aria-live="polite"></p>
    </section>

    <p class="hint">Зажмите мышку для вращения • Скролл для масштаба</p>

    <div class="loading" id="loading">
      <div class="loading__spinner" aria-hidden="true"></div>
      <p>Собираем модель…</p>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
