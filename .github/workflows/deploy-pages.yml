# Деплой на GitHub Pages — ТОЛЬКО вручную (workflow_dispatch).
# Pages из этой ветки нельзя включить токеном из CI (проверено: 403 "Resource not accessible"),
# поэтому автозапуск на push убран, чтобы не ловить красные ✗.
#
# Самый простой способ опубликовать сайт — вообще без этого workflow:
#   Settings → Pages → Source: "Deploy from a branch" → ветка arena/c313f989-3d-tumba → папка / (root) → Save.
#
# Этот workflow — альтернатива, если в Settings → Pages выбрано "GitHub Actions":
#   вкладка Actions → "Deploy to GitHub Pages (manual)" → Run workflow.
name: Deploy to GitHub Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
